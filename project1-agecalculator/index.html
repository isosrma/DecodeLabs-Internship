<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Age Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <section class="calculator-card">

      <div class="header">
        <div class="icon">🎂</div>
        <h1>Age Calculator</h1>
        <p>Calculate your exact age instantly</p>
      </div>

      <div class="form-group">
        <label for="birthDate">Enter your date of birth</label>

        <div class="date-wrapper">
          <input type="date" id="birthDate">
          <span class="calendar-icon">📅</span>
        </div>
      </div>

      <button id="calculateBtn" class="calculate-btn">
        Calculate Age
        <span>→</span>
      </button>

      <p id="errorMessage" class="error"></p>

      <div id="result" class="result">

        <div class="result-title">
          Your Age
        </div>

        <div class="age-boxes">

          <div class="age-box">
            <strong id="years">0</strong>
            <span>Years</span>
          </div>

          <div class="age-box">
            <strong id="months">0</strong>
            <span>Months</span>
          </div>

          <div class="age-box">
            <strong id="days">0</strong>
            <span>Days</span>
          </div>

        </div>

        <div class="next-birthday">
          <span>🎉</span>
          <p id="birthdayMessage">Your next birthday information will appear here.</p>
        </div>

      </div>

      <div class="footer">
        <span>🔒</span>
        Your date stays on your device
      </div>

    </section>

  </main>

  <script src="scripts.js"></script>
</body>
</html>
